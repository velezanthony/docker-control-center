# Este proyecto no tiene dependencias de ejecución: es bash, docker y awk. Lo
# único versionado que puede quedarse atrás son las acciones de los workflows y
# las dependencias de la documentación.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # docs/requirements.txt fija las versiones del sitio CON TECHO, así que
  # dependabot propone subidas dentro del rango. Levantar un techo —MkDocs 2.0
  # elimina los plugins— tiene que ser una decisión, no un PR automático.
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      mkdocs:
        patterns:
          - "mkdocs*"
          - "pymdown*"
