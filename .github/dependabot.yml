# Este proyecto no tiene dependencias de ejecución: es bash, docker y awk. Lo
# único versionado que puede quedarse atrás son las acciones de los workflows.
# La librería de la documentación va fijada a una etiqueta en docs-site/: se
# sube a mano, cambiando la etiqueta.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
