# Integración continua.
#
# No necesita Docker: los tests prueban funciones puras y de formateo con datos
# inyectados. Por eso corren en segundos y en cualquier máquina.
name: CI

# El push se acota a las ramas de integración. Con `branches: ["**"]` cada PR
# corría DOS veces: una por el push a su rama y otra por el propio PR. En una
# rama de trabajo la CI la dispara el pull_request, que es cuando importa.
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    name: check (bash 5, mawk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar shellcheck y jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Versiones (lo primero que se pide en una incidencia)
        run: |
          bash --version | head -1
          awk --version 2>&1 | head -1 || true
          shellcheck --version | grep version:
          jq --version

      - name: make check
        run: make check

      # El empaquetado se comprueba aparte: un fichero único roto no lo detecta
      # nadie hasta que un usuario se lo baja.
      - name: Generar el fichero único
        run: make bundle

      - name: El fichero único arranca fuera del repositorio
        run: |
          cp dist/docker-control-center.sh /tmp/dcc
          cd /tmp
          ./dcc version
          ./dcc help >/dev/null

      - name: Subirlo como artefacto de la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: docker-control-center
          path: dist/docker-control-center.sh
          retention-days: 14

  # El README promete bash 4+. Ejecutarlo solo en el runner —bash 5.2— era
  # verificar la letra de la regla sin correr nunca la configuración prometida.
  #
  # ubuntu:18.04 y no la imagen `bash:4.4`: esa es Alpine y trae busybox awk, con
  # lo que mezclaría dos incompatibilidades distintas. 18.04 da bash 4.4 con
  # mawk, que es exactamente lo que dice el README.
  #
  # Se lanza con `docker run` y no con `container:` porque actions/checkout
  # necesita node dentro del contenedor.
  bash4:
    name: bash 4 (lo que promete el README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Suite bajo bash 4.4 + mawk
        run: |
          docker run --rm -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            -v "$PWD:/repo" -w /repo ubuntu:18.04 sh -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq make curl ca-certificates
              bash --version | head -1
              # `bash -n` es la parte de `make check` que SÍ depende de la
              # versión: aquí es donde se caza sintaxis de bash 5 colada. El
              # shellcheck de 18.04 es 0.4.6 y no entiende nuestras -o, y da
              # igual: shellcheck no depende del bash que lo ejecute, así que
              # correrlo tres veces no añade nada.
              for f in src/scripts/*.sh src/tests/*.sh build.sh deps.sh; do
                bash -n "$f" || exit 1
              done
              echo "todo parsea bajo bash 4"
              make test
            '

  # El código dice evitar las extensiones de GNU para funcionar igual con mawk
  # que con gawk. Los runners traen mawk, así que gawk no se probaba nunca.
  gawk:
    name: gawk (sin extensiones GNU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Poner gawk como el awk del sistema
        run: |
          sudo apt-get update && sudo apt-get install -y gawk
          sudo update-alternatives --set awk /usr/bin/gawk
          awk --version | head -1
      - run: make test
