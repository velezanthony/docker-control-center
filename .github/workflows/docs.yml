# Publica la documentación en GitHub Pages: artefacto + deploy-pages, sin rama
# gh-pages. Las páginas siguen en docs/; el sitio de Astro (docs-site/) solo las
# construye con @velezanthony/design.
name: Docs

on:
  # Se CONSTRUYE también en los PRs y solo se DESPLIEGA desde main. El build
  # falla con un enlace o un ancla rotos: sin el pull_request no se vería hasta
  # después de mergear.
  # La lista va duplicada a propósito: GitHub Actions no soporta anchors de
  # YAML de forma fiable, y un workflow que no parsea no avisa, simplemente no
  # corre.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      # fetch-depth: 0 para que el sitemap tenga la fecha del último commit de
      # cada página: un clon superficial no da fechas.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # `enablement: true` activa Pages si aún no lo está, en vez de abortar con
      # "Get Pages site failed / Not Found". Así el workflow no depende de que
      # alguien se acuerde de tocar Settings.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  # Nada de desplegar desde un PR: solo se publica lo que ya está en main.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
