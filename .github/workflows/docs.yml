# Publica el sitio de mkdocs en GitHub Pages. Mismo patrón que
# django-cotton-gallery: artefacto + deploy-pages, sin rama gh-pages.
#
# La diferencia: allí las dependencias salen de `pip install -e ".[docs]"`
# porque es un paquete Python. Esto es bash, así que van en docs/requirements.txt.
name: Docs

on:
  # Se CONSTRUYE también en los PRs y solo se DESPLIEGA desde main. Sin el
  # pull_request, un `mkdocs build --strict` roto —una nav que apunta a una
  # página que no existe— no se vería hasta después de mergear.
  # La lista va duplicada a propósito: GitHub Actions no soporta anchors de
  # YAML de forma fiable, y un workflow que no parsea no avisa, simplemente no
  # corre.
  push:
    branches: [main]
    paths:
      - "docs/**"          # incluye docs/requirements.txt
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.12

      - name: Install docs dependencies
        run: uv pip install -r docs/requirements.txt

      # --strict convierte en error lo que si no es un aviso que nadie lee: una
      # entrada de la nav apuntando a una página que no existe, un enlace roto.
      # La nav llegó a declarar cuatro páginas inexistentes sin que se notara.
      - name: Build site
        run: uv run --no-sync mkdocs build --strict

      # `enablement: true` activa Pages si aún no lo está, en vez de abortar con
      # "Get Pages site failed / Not Found". Así el workflow no depende de que
      # alguien se acuerde de tocar Settings.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # Nada de desplegar desde un PR: solo se publica lo que ya está en main.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
